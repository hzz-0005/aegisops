name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Compile check
        run: python -m compileall -q src apps lab scripts

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      # Pure-logic suite: no PostgreSQL, no Docker, no network. The full suite
      # (351 tests incl. Temporal/LLM-gated paths) needs the local Lab; see
      # README and CONTRIBUTING for the verified runtime evidence approach.
      - name: Unit tests (no external services)
        # python -m pytest keeps the repo root on sys.path so tests can import
        # the scripts/ package; bare pytest on CI cannot.
        run: >
          python -m pytest
          tests/test_agent_blind_scoring.py
          tests/test_domain.py
          tests/test_normalization.py
          tests/test_partition_evaluation.py
          tests/test_fault_evaluation.py
          tests/test_agent_remediation.py
          tests/test_correlation_rules.py
          tests/test_incident_correction_contracts.py
          tests/test_deployment_fingerprint.py
          tests/test_model_provider_profiles.py
          -q

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OPA policy tests
        run: |
          curl -L -o /usr/local/bin/opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
          cd infra/opa && opa test . -v

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose config parses
        run: docker compose config > /dev/null
