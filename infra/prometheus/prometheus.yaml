global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: lab-health-probe
    static_configs:
      - targets: ["lab-health-probe:8000"]

  - job_name: lab-runtime-observer
    scrape_timeout: 8s
    scrape_interval: 10s
    static_configs:
      - targets: ["lab-executor:8011"]
